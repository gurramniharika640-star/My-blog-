<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>My Blog</h1>
  <nav>
    <a href="#" onclick="showHome()">Home</a>
    <a href="#" onclick="filterCategory('Technology')">Technology</a>
    <a href="#" onclick="filterCategory('Education')">Education</a>
    <a href="#" onclick="filterCategory('Lifestyle')">Lifestyle</a>
  </nav>
</header>

<section class="hero">
  <h2>Welcome to My Blog</h2>
  <p>Learn, Explore and Discover Something New</p>

  <input
    type="text"
    id="searchInput"
    placeholder="Search articles..."
    onkeyup="searchArticles()"
  >
</section>

<main>
  <h2>Latest Articles</h2>
  <div id="articles" class="article-grid"></div>
</main>

<footer>
  <p>© 2026 My Blog | All Rights Reserved</p>
</footer>

<script src="script.js"></script>
</body>
</html>
